version: "3.9"

services:
  db:
    image: postgres:16
    container_name: retail-intel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password}
      POSTGRES_DB: ${POSTGRES_DB:-retail_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retail-net

  redis:
    image: redis:7
    container_name: retail-intel-redis
    ports:
      - "6379:6379"
    networks:
      - retail-net

  backend:
    build: ./backend
    container_name: retail-intel-backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db
      REDIS_HOST: redis
      AI_ENGINE_URL: http://ai-engine:8000
    depends_on:
      - db
      - redis
      - ai-engine
    ports:
      - "4000:4000"
    networks:
      - retail-net

  ai-engine:
    build: ./ai-engine
    container_name: retail-intel-ai
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    networks:
      - retail-net

  frontend:
    build: ./frontend
    container_name: retail-intel-frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - retail-net

volumes:
  postgres_data:

networks:
  retail-net:
    driver: bridge

